name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.85.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate dependency lock
        run: cargo generate-lockfile
      - name: Upload generated lockfile
        if: matrix.toolchain == '1.85.0'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps
  systemd:
    name: systemd hardening
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Provide executable target for verification
        run: sudo install -m 0755 /bin/true /usr/local/sbin/kovert-daemon
      - name: Verify service file
        run: systemd-analyze verify packaging/kovert.service

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check scripts
        run: shellcheck scripts/*.sh
